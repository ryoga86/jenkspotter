# ---------------------------------------------------------------------------------------------
# Plugin identity - the plugin ID can NOT be changed after the first Marketplace release.
# ---------------------------------------------------------------------------------------------
pluginGroup = de.pdenis.jenkspotter
pluginId = de.pdenis.jenkspotter
pluginName = JenkSpotter
pluginVendor = Peter Denis
pluginVendorEmail = mail@pdenis.de
pluginRepositoryUrl = https://github.com/ryoga86/jenkspotter
pluginVersion = 1.0.1

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# 251 = IntelliJ Platform 2025.1. No until-build -> compatible with all newer IDEs until proven otherwise.
pluginSinceBuild = 251

# IntelliJ Platform used for compiling / runIde / tests. 2025.2; the older 2025.1 line (since-build) is covered by
# the plugin verifier.
platformVersion = 2025.2.6.4

# ---------------------------------------------------------------------------------------------
# Optional, machine specific - put these into ~/.gradle/gradle.properties or the git-ignored
# local.properties (never into this file):
#   jenkspotter.ideaPluginsDir = /Users/<you>/Library/Application Support/JetBrains/IntelliJIdea2026.2/plugins
#                                                                  -> `installToIde` (local.properties is enough)
#   buildSearchableOptions = false                                 -> faster local builds
#   jenkspotter.signing.certificateChainFile = /path/to/chain.crt  -> signing (alternative: env CERTIFICATE_CHAIN)
#   jenkspotter.signing.privateKeyFile = /path/to/private_encrypted.pem   (alternative: env PRIVATE_KEY)
#   jenkspotter.signing.password = ...                                    (alternative: env PRIVATE_KEY_PASSWORD)
#   jenkspotter.publishToken = perm:...                            -> Marketplace upload (alternative: env PUBLISH_TOKEN)
# ---------------------------------------------------------------------------------------------

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
